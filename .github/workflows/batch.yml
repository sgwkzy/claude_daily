name: Batch

on:
  # 現在は記事生成をローカルで実行しているため cron を停止中。
  # クラウド実行へ切り替えるときは下の schedule を有効化する。
  # schedule:
  #   - cron: "0 0,8,16 * * *"
  workflow_dispatch:

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 依存関係をインストール
        run: pip install -r batch/requirements.txt

      - name: バッチを実行
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # X 投稿は post-x.yml が push をトリガに走るため、ここでは X 系 secrets を渡さない。
        # main.py 側は env 未設定なら自動でスキップする。
        run: python batch/main.py --no-x-post

      - name: 変更をコミット
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update generated youtube articles"
          file_pattern: site/src/content/articles site/public/images

