name: Deploy

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
      PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
      PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.PUBLIC_ADSENSE_CLIENT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package.json

      - name: 依存関係をインストール
        run: npm install

      - name: Astro をビルド
        run: npm run build

      - name: Pages アーティファクトを準備
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      INDEXNOW_ENDPOINT: https://www.bing.com/indexnow
      INDEXNOW_KEY: b32626ab-6fcd-48b6-a66e-edb27a8f8b56
      SITE_URL: https://claude-daily.com
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4

      - name: IndexNow ペイロードを生成
        run: node site/scripts/build-indexnow-payload.mjs site/src/content/articles "$SITE_URL" "$INDEXNOW_KEY" > indexnow.json

      - name: IndexNow に送信
        run: |
          http_code=$(curl -sS -o indexnow-response.txt -w "%{http_code}" \
            -X POST "$INDEXNOW_ENDPOINT" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json)
          cat indexnow-response.txt
          if [ "$http_code" != "200" ] && [ "$http_code" != "202" ]; then
            echo "IndexNow submission failed with HTTP $http_code"
            exit 1
          fi
