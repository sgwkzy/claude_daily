youtube:
  keywords:
    - Claude
    - Claude Code
    - Anthropic
    - MCP
    - AIエージェント
  limit_total: 10
  per_keyword_top_n: 5
  min_view_count: 5000
  min_duration_sec: 180
  max_age_hours: 72
  region_code: JP
  # グローバル版運用: JP と US を叩いて videoId でデデュープ（ranker が処理）。
  # 単一地域に戻す場合は regions を空にすれば region_code(JP) にフォールバックする。
  regions:
    - JP
    - US
pipeline:
  dry_run_limit: 2
  section_count_min: 3
  section_count_max: 5
  output_articles_dir: site/src/content/articles
  output_images_dir: site/public/images
  temp_dir: batch/tmp
prompts:
  trend_limit: 3
  header_style: warm editorial collage, soft beige and coral palette, abstract paper-cut shapes, calm and modern
  thumbnail_directions:
    - source-explainer
